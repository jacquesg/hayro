[package]
name = "beeld-fuzz"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
beeld-ccitt = { workspace = true }
beeld-jbig2 = { workspace = true }
beeld-jpeg2000 = { workspace = true, features = ["image"] }
image = { workspace = true, default-features = false }

[[bin]]
name = "fuzz_jbig2"
path = "fuzz_targets/fuzz_jbig2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jpeg2000"
path = "fuzz_targets/fuzz_jpeg2000.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ccitt"
path = "fuzz_targets/fuzz_ccitt.rs"
test = false
doc = false
bench = false
