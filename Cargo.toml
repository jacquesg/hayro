[workspace]
resolver = "2"
members = [
    "beeld-interpret",
    "beeld",
    "beeld-bench",
    "beeld-syntax",
    "beeld-demo",
    "beeld-tests",
    "beeld-write",
    "beeld-svg",
    "beeld-jpeg2000",
    "beeld-jbig2",
    "beeld-ccitt",
    "beeld-fuzz",
    "beeld-postscript",
    "beeld-cmap"
]

[workspace.package]
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2024"
rust-version = "1.92" # MSRV floor; the dev/CI toolchain is pinned in mise.toml
repository = "https://git.bloudraad.io/bloudraad/beeld"
readme = "README.md"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
beeld = { path = "beeld", version = "0.7.0", default-features = false }
beeld-ccitt = { path = "beeld-ccitt", version = "0.3.0", default-features = false }
beeld-interpret = { path = "beeld-interpret", version = "0.7.0", default-features = false }
beeld-jpeg2000 = { path = "beeld-jpeg2000", version = "0.4.0", default-features = false }
beeld-jbig2 = { path = "beeld-jbig2", version = "0.3.0", default-features = false }
beeld-syntax = { path = "beeld-syntax", version = "0.7.2", default-features = false }
beeld-svg = { path = "beeld-svg", version = "0.7.0", default-features = false }
beeld-write = { path = "beeld-write", version = "0.7.0", default-features = false }
beeld-postscript = { path = "beeld-postscript", version = "0.1.0", default-features = false }
beeld-cmap = { path = "beeld-cmap", version = "0.1.0", default-features = false }

bitflags = { version = "2.10" }
bytemuck = { version = "1" }
image = { version = "0.25", default-features = false }
kurbo = { version = "0.13.0" }
log = { version = "0.4" }
svgraster = { git = "ssh://git@git.bloudraad.io/bloudraad/svgraster.git", branch = "main" }
flate2 = { version = "1" }
phf = { version = "0.13.1", default-features = false }
moxcms = { version = "0.8.1" }
rustc-hash = { version = "2" }
siphasher = "1"
skrifa = { version = "0.42.0" }
smallvec = { version = "1" }
yoke = { version = "0.8" }
henog = { git = "ssh://git@git.bloudraad.io/bloudraad/henog.git", branch = "main" }
sitro = { git = "https://github.com/LaurenzV/sitro", rev="fb804b3" }
xmlwriter = { version = "0.1" }
base64 = { version = "0.22" }
zune-jpeg = { version = "0.5", default-features = false }
vello_cpu = { git = "https://github.com/linebender/vello", rev = "8442ef4", default-features = false, features = ["std", "png", "u8_pipeline"] }
pic-scale = { version = "0.7.9", default-features = false, features = ["neon", "rdm", "sse", "avx"] }
fearless_simd = "0.4.0"
brotli = { version = "8", default-features = false, features = ["std"] }
memchr = { version = "2.8.0", default-features = false, features = ["alloc"] }

[workspace.lints]
# This one may vary depending on the project.
#rust.unsafe_code = "forbid"

# LINEBENDER LINT SET - Cargo.toml - v7
# See https://linebender.org/wiki/canonical-lints/
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
#rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

#clippy.allow_attributes_without_reason = "warn"
#clippy.cast_possible_truncation = "warn"
clippy.collection_is_never_read = "warn"
clippy.default_trait_access = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
#clippy.missing_assert_message = "warn"
#clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
#clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

#clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

# Makes it easier to debug with a profiler
[profile.instrument]
inherits = "release"
debug = true
strip = "none"

[profile.fuzz]
inherits = "release"
debug = 1
overflow-checks = true
