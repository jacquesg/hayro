name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  checks:
    name: Check clippy, formatting, and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: RUSTFLAGS="-D warnings" cargo clippy --workspace --exclude beeld-demo --exclude beeld-bench --tests --examples
      - run: cargo fmt --check --all
      - run: RUSTFLAGS="-D warnings" cargo doc --workspace --exclude beeld-demo --exclude beeld-bench --no-deps
      - run: RUSTFLAGS="-D warnings" cargo hack check --each-feature --workspace --exclude beeld-demo --exclude beeld-bench

  min-version:
    name: Check minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
  
  no_std:
    name: Check no_std compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p beeld-ccitt --target thumbv6m-none-eabi
      - run: cargo check -p beeld-jbig2 --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p beeld-jpeg2000 --no-default-features --target thumbv6m-none-eabi
      - run: cargo check -p beeld-syntax --no-default-features --target thumbv6m-none-eabi
    

  load_tests:
    name: Run CI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p beeld-tests -- "load::"
